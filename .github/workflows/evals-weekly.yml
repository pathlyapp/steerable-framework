name: Evals weekly

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      split:
        description: cheap-12 smoke, failed-prev iteration (~41 ids), or full catalog (89 ids)
        type: choice
        options:
          - cheap-12
          - failed-prev
          - catalog
        default: cheap-12

permissions:
  contents: read

concurrency:
  group: evals-${{ github.event.inputs.split || 'cheap-12' }}
  cancel-in-progress: false

jobs:
  eval:
    name: TB 2.1 cheap-12 × ${{ matrix.agent }}
    if: ${{ github.event_name == 'schedule' || github.event.inputs.split == 'cheap-12' }}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        agent: [steerable, claude-code, codex, pi]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - uses: ./.github/actions/setup-harbor
      - run: docker info
      - name: Harbor cheap-12
        env:
          # Product agent: same OpenAI-compatible gateway as local glm
          # (OpenRouter / 万界). Do not put that key in OPENAI_API_KEY —
          # Codex would send it to api.openai.com.
          STEERABLE_API_KEY: ${{ secrets.STEERABLE_API_KEY }}
          STEERABLE_BASE_URL: ${{ secrets.STEERABLE_BASE_URL }}
          # Baseline agents: official vendor keys, skipped when unset.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CODEX_API_KEY: ${{ secrets.CODEX_API_KEY }}
        run: |
          set +e
          uv run python -m evals.run --agent "${{ matrix.agent }}" --split cheap-12 --skip-missing-env --n-concurrent 2 --agent-setup-timeout-multiplier 3 --environment-build-timeout-multiplier 3 --agent-timeout-multiplier 3
          code=$?
          if [ "$code" -eq 3 ]; then
            echo skipped > "eval-status-${{ matrix.agent }}.txt"
            echo "${{ matrix.agent }}: skipped" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "$code" -eq 0 ]; then
            echo ran > "eval-status-${{ matrix.agent }}.txt"
            echo "${{ matrix.agent }}: ran" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo failed > "eval-status-${{ matrix.agent }}.txt"
          echo "${{ matrix.agent }}: failed ($code)" >> "$GITHUB_STEP_SUMMARY"
          exit "$code"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-${{ matrix.agent }}
          path: |
            eval-status-${{ matrix.agent }}.txt
            evals/jobs/${{ matrix.agent }}/*/result.json
            evals/jobs/${{ matrix.agent }}/*/*/agent/headless.log
            evals/jobs/${{ matrix.agent }}/*/*/verifier/test-stdout.txt
            evals/jobs/${{ matrix.agent }}/*/*/exception.txt
          if-no-files-found: ignore

  failed-prev:
    name: TB 2.1 failed-prev × steerable shard ${{ matrix.shard }}/4
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.split == 'failed-prev' }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - uses: ./.github/actions/setup-harbor
      - run: docker info
      - name: Harbor failed-prev shard
        env:
          STEERABLE_API_KEY: ${{ secrets.STEERABLE_API_KEY }}
          STEERABLE_BASE_URL: ${{ secrets.STEERABLE_BASE_URL }}
        run: |
          set +e
          uv run python -m evals.run --agent steerable --split failed-prev --shard "${{ matrix.shard }}" --shards 4 --skip-missing-env --n-concurrent 2 --agent-setup-timeout-multiplier 3 --environment-build-timeout-multiplier 3 --agent-timeout-multiplier 3
          code=$?
          if [ "$code" -eq 3 ]; then
            echo skipped > eval-status-steerable.txt
            echo "shard ${{ matrix.shard }}: skipped" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "$code" -eq 0 ]; then
            echo ran > eval-status-steerable.txt
            echo "shard ${{ matrix.shard }}: ran" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo failed > eval-status-steerable.txt
          echo "shard ${{ matrix.shard }}: failed ($code)" >> "$GITHUB_STEP_SUMMARY"
          exit "$code"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-steerable-${{ matrix.shard }}
          path: |
            eval-status-steerable.txt
            evals/jobs/steerable/*/result.json
            evals/jobs/steerable/*/*/agent/headless.log
            evals/jobs/steerable/*/*/verifier/test-stdout.txt
            evals/jobs/steerable/*/*/exception.txt
          if-no-files-found: ignore

  catalog:
    name: TB 2.1 catalog × steerable shard ${{ matrix.shard }}/8
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.split == 'catalog' }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - uses: ./.github/actions/setup-harbor
      - run: docker info
      - name: Harbor catalog shard
        env:
          STEERABLE_API_KEY: ${{ secrets.STEERABLE_API_KEY }}
          STEERABLE_BASE_URL: ${{ secrets.STEERABLE_BASE_URL }}
        run: |
          set +e
          uv run python -m evals.run --agent steerable --split catalog --shard "${{ matrix.shard }}" --shards 8 --skip-missing-env --n-concurrent 2 --agent-setup-timeout-multiplier 3 --environment-build-timeout-multiplier 3 --agent-timeout-multiplier 3
          code=$?
          if [ "$code" -eq 3 ]; then
            echo skipped > eval-status-steerable.txt
            echo "shard ${{ matrix.shard }}: skipped" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "$code" -eq 0 ]; then
            echo ran > eval-status-steerable.txt
            echo "shard ${{ matrix.shard }}: ran" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo failed > eval-status-steerable.txt
          echo "shard ${{ matrix.shard }}: failed ($code)" >> "$GITHUB_STEP_SUMMARY"
          exit "$code"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-steerable-${{ matrix.shard }}
          path: |
            eval-status-steerable.txt
            evals/jobs/steerable/*/result.json
            evals/jobs/steerable/*/*/agent/headless.log
            evals/jobs/steerable/*/*/verifier/test-stdout.txt
            evals/jobs/steerable/*/*/exception.txt
          if-no-files-found: ignore

  notify-start:
    name: Feishu started
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Post start card
        env:
          FEISHU_BOT_WEBHOOK: ${{ secrets.FEISHU_BOT_WEBHOOK }}
          EVAL_SPLIT: ${{ github.event.inputs.split || 'cheap-12' }}
        run: |
          python3 - << 'PY'
          import os, json, urllib.request
          url = (os.environ.get("FEISHU_BOT_WEBHOOK") or "").strip()
          if not url:
              print("FEISHU_BOT_WEBHOOK unset; skip")
              raise SystemExit(0)
          split = os.environ.get("EVAL_SPLIT") or "cheap-12"
          if split == "catalog":
              title = "开始 · GHA catalog 89"
              body = "产品 steerable × 全量 89 题，8 分片并行。"
          elif split == "failed-prev":
              title = "开始 · GHA failed-prev"
              body = "产品 steerable × 上次 catalog 失败题（约 41），4 分片。用来迭代 harness，不是正式分。"
          else:
              title = "开始 · GHA cheap-12"
              body = "产品 steerable 用网关 key；对照无官方 key 会跳过。"
          run = f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}"
          payload = {
              "msg_type": "interactive",
              "card": {
                  "header": {
                      "title": {"tag": "plain_text", "content": title},
                      "template": "blue",
                  },
                  "elements": [
                      {"tag": "div", "text": {"tag": "lark_md", "content": f"{body}\n[GHA run]({run})"}},
                  ],
              },
          }
          req = urllib.request.Request(url, data=json.dumps(payload).encode(), headers={"Content-Type": "application/json"}, method="POST")
          urllib.request.urlopen(req, timeout=20).read()
          PY

  gather:
    name: At least one live agent ran
    needs: [eval, catalog, failed-prev]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          pattern: eval-*
          path: statuses
      - name: Feishu result
        env:
          FEISHU_BOT_WEBHOOK: ${{ secrets.FEISHU_BOT_WEBHOOK }}
          EVAL_SPLIT: ${{ github.event.inputs.split || 'cheap-12' }}
        run: |
          label="GHA cheap-12"
          if [ "$EVAL_SPLIT" = "catalog" ]; then
            label="GHA catalog 89"
          elif [ "$EVAL_SPLIT" = "failed-prev" ]; then
            label="GHA failed-prev"
          fi
          python3 -m evals.feishu \
            --root statuses \
            --label "$label" \
            --run-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            || echo "::warning::Feishu post failed"
      - name: Fail if every live agent was skipped
        run: |
          shopt -s globstar nullglob
          files=(statuses/**/eval-status-*.txt)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "no eval-status artifacts; live agents did not start"
            exit 1
          fi
          cat "${files[@]}"
          if grep -qx ran "${files[@]}"; then
            echo "at least one live agent ran"
            exit 0
          fi
          if grep -qx failed "${files[@]}"; then
            echo "a live agent ran and failed; the matrix job already failed"
            exit 0
          fi
          echo "every live agent was skipped (set STEERABLE_API_KEY + STEERABLE_BASE_URL for the product agent)"
          exit 1
