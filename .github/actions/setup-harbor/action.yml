name: Setup Harbor
description: Install the pinned Harbor CLI and put it on PATH.

inputs:
  version:
    description: Harbor version (keep in sync with evals/suite.yaml run.harbor_version)
    required: false
    default: "0.22.0"
  rust-coreloop:
    description: Build and expose the Linux abi3 wheel used by Rust CoreLoop trials
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Install Harbor
      shell: bash
      run: |
        uv tool install "harbor==${{ inputs.version }}"
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"
    - name: Build Rust CoreLoop manylinux wheel
      if: inputs.rust-coreloop == 'true'
      uses: PyO3/maturin-action@v1
      with:
        command: build
        manylinux: "2_17"
        working-directory: packages/agent-runtime/rs
        args: --release --locked --features python,extension-module
    - name: Build Rust CoreLoop musllinux wheel
      if: inputs.rust-coreloop == 'true'
      uses: PyO3/maturin-action@v1
      with:
        command: build
        target: x86_64-unknown-linux-musl
        manylinux: musllinux_1_2
        working-directory: packages/agent-runtime/rs
        args: --release --locked --features python,extension-module
    - name: Expose Rust CoreLoop wheel
      if: inputs.rust-coreloop == 'true'
      shell: bash
      run: |
        readarray -t wheels < <(python - <<'PY'
        from pathlib import Path
        wheels = sorted(Path("packages/agent-runtime/rs/target/wheels").glob("*.whl"))
        manylinux = [wheel for wheel in wheels if "manylinux" in wheel.name]
        musllinux = [wheel for wheel in wheels if "musllinux" in wheel.name]
        if len(manylinux) != 1 or len(musllinux) != 1:
            raise SystemExit(
                "expected one manylinux and one musllinux Rust CoreLoop wheel, "
                f"found manylinux={manylinux}, musllinux={musllinux}"
            )
        print(manylinux[0].resolve())
        print(musllinux[0].resolve())
        PY
        )
        echo "STEERABLE_NATIVE_WHEEL=${wheels[0]}" >> "$GITHUB_ENV"
        echo "STEERABLE_NATIVE_WHEEL_MUSL=${wheels[1]}" >> "$GITHUB_ENV"
        echo "STEERABLE_RUST_CORELOOP=1" >> "$GITHUB_ENV"
    - name: Prefetch musl uv for qemu trials
      shell: bash
      run: |
        dest="${GITHUB_WORKSPACE}/evals/.cache/uv-x86_64-unknown-linux-musl"
        mkdir -p "$(dirname "$dest")"
        if [ -s "$dest" ]; then
          exit 0
        fi
        curl -fsSL -o /tmp/uv-musl.tgz \
          https://github.com/astral-sh/uv/releases/download/0.9.5/uv-x86_64-unknown-linux-musl.tar.gz
        extract=$(mktemp -d)
        tar -xzf /tmp/uv-musl.tgz -C "$extract"
        bin=$(find "$extract" -name uv -type f | head -1)
        cp "$bin" "$dest"
        chmod 0755 "$dest"
    - name: Prefetch Linux CPython 3.12 for qemu trials
      shell: bash
      run: |
        dest="${GITHUB_WORKSPACE}/evals/.cache/cpython-3.12-linux-x86_64-gnu.tgz"
        mkdir -p "$(dirname "$dest")"
        if [ -s "$dest" ]; then
          exit 0
        fi
        uv python install 3.12
        py=$(uv python find 3.12)
        prefix=$(cd "$(dirname "$py")/.." && pwd)
        tar -czf "$dest" -C "$prefix" .
