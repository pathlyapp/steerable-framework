name: Sidecar build

on:
  workflow_dispatch:
  push:
    tags: ["sidecar-v*"]

jobs:
  build:
    name: Build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: darwin-arm64
          - os: macos-13
            target: darwin-x64
          - os: ubuntu-22.04
            target: linux-x64
          - os: windows-2022
            target: win32-x64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        # The build/report steps use bash line continuations and quoting;
        # on Windows the default pwsh parses `\`-continuations as errors.
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build sidecar bundle
        # 320 MB per-target size budget. The build uses the
        # `install_only_stripped` python-build-standalone variant (~300 MB
        # unpacked on Linux x64 vs ~700 MB for `install_only`); strip +
        # aggressive then removes unused stdlib, __pycache__, dist-info
        # metadata, pip/setuptools, and third-party tests/examples/docs.
        run: |
          python packages/sidecar/build/build_sidecar.py \
            --target ${{ matrix.target }} \
            --strip-stdlib \
            --aggressive \
            --budget-mb 320
      - name: Report bundle size
        run: |
          python -c "import json,pathlib; m=json.loads(pathlib.Path('packages/sidecar/dist/python-runtime/${{ matrix.target }}/manifest.json').read_text()); mb=m['totalBytes']/1024/1024; print(f'::notice title=Sidecar bundle size::${{ matrix.target }}: {mb:.1f} MB')"
      - uses: actions/upload-artifact@v5
        with:
          name: steerable-sidecar-${{ matrix.target }}
          path: packages/sidecar/dist/python-runtime/${{ matrix.target }}
          if-no-files-found: error
