name: Evals oracle

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "evals/**"
      - ".github/workflows/evals-oracle.yml"
      - ".github/actions/setup-harbor/**"
      - "packages/sidecar/py/**"
      - "packages/agent-runtime/py/**"
      - "packages/agent-harness/py/**"
      - "packages/agent-protocol/py/**"
  push:
    branches: [main]
    paths:
      - "evals/**"
      - ".github/workflows/evals-oracle.yml"
      - ".github/actions/setup-harbor/**"
      - "packages/sidecar/py/**"
      - "packages/agent-runtime/py/**"
      - "packages/agent-harness/py/**"
      - "packages/agent-protocol/py/**"

permissions:
  contents: read

concurrency:
  group: evals-oracle-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  oracle:
    name: Harbor oracle × fix-git
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - uses: ./.github/actions/setup-harbor
      - run: docker info
      - name: Harbor oracle canary
        run: uv run python -m evals.run --agent oracle --split oracle-canary --require-mean 1.0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: oracle-fix-git
          path: evals/jobs/oracle/*/result.json
          if-no-files-found: ignore

  steerable:
    name: Harbor steerable × fix-git
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - uses: ./.github/actions/setup-harbor
      - run: docker info
      - name: Harbor product canary
        env:
          STEERABLE_API_KEY: ${{ secrets.STEERABLE_API_KEY }}
          STEERABLE_BASE_URL: ${{ secrets.STEERABLE_BASE_URL }}
        run: |
          set +e
          uv run python -m evals.run --agent steerable --split oracle-canary --skip-missing-env --agent-setup-timeout-multiplier 3 --environment-build-timeout-multiplier 3 --agent-timeout-multiplier 3
          code=$?
          if [ "$code" -eq 3 ]; then
            echo "::warning::steerable canary skipped (set STEERABLE_API_KEY and STEERABLE_BASE_URL)"
            exit 0
          fi
          exit "$code"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: steerable-fix-git
          path: |
            evals/jobs/steerable/*/result.json
            evals/jobs/steerable/*/*/agent/headless.log
            evals/jobs/steerable/*/*/verifier/test-stdout.txt
            evals/jobs/steerable/*/*/exception.txt
          if-no-files-found: ignore

  notify:
    name: Feishu result
    needs: [oracle, steerable]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          pattern: "*-fix-git"
          path: statuses
      - name: Feishu result
        env:
          FEISHU_BOT_WEBHOOK: ${{ secrets.FEISHU_BOT_WEBHOOK }}
        run: |
          python3 -m evals.feishu \
            --root statuses \
            --label "GHA oracle canary" \
            --run-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            || echo "::warning::Feishu post failed"
