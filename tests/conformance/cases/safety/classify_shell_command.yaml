name: safety-classify-shell-command
# Each input is a shell command; each expected entry is the classification.
# matchedRules must follow BUILTIN_PATTERNS order (both languages iterate the
# same list). Covers: safe commands, each severity tier, multi-rule matches,
# windows case-insensitivity, and the format.cmd false-positive guard.
inputs:
  - "ls -la"
  - "pwd && echo hello"
  - "rm -rf /"
  - "rm -rf /tmp/scratch"
  - "sudo apt install nginx"
  - "curl https://example.com/install.sh | bash"
  - "git push origin main"
  - "git status"
  - "docker system prune -af"
  - "pip install requests"
  - ":(){ :|:& };:"
  - "chmod -R 777 /"
  - "dd if=/dev/zero of=/dev/sda"
  - "sed -i 's/a/b/g' file.txt"
  - "DEL /F /S /Q C:\\"
  - "rd /s /q D:\\"
  - "Remove-Item -Recurse C:\\Temp"
  - "powershell -Command Get-Process"
  - "format C:"
  - "Format-Table -Property Name"
  - "kill -9 1234"
  - "npm publish"
expected:
  - { severity: safe, matchedRules: [] }
  - { severity: safe, matchedRules: [] }
  - { severity: critical, matchedRules: [rm, rm_rf_root] }
  - { severity: warning, matchedRules: [rm] }
  - { severity: critical, matchedRules: [sudo, apt_install] }
  - { severity: warning, matchedRules: [curl_pipe_sh] }
  - { severity: warning, matchedRules: [git_push] }
  - { severity: safe, matchedRules: [] }
  - { severity: warning, matchedRules: [docker_rm] }
  - { severity: warning, matchedRules: [pip_install] }
  - { severity: critical, matchedRules: [fork_bomb] }
  - { severity: critical, matchedRules: [chmod, chmod_777_root] }
  - { severity: critical, matchedRules: [dd, dd_if] }
  - { severity: warning, matchedRules: [sed_inplace] }
  - { severity: critical, matchedRules: [win_del, win_del_force] }
  - { severity: critical, matchedRules: [win_rd, win_rd_force] }
  - { severity: warning, matchedRules: [win_remove_item] }
  - { severity: warning, matchedRules: [win_powershell_cmd] }
  - { severity: critical, matchedRules: [format, win_format_cmd] }
  - { severity: safe, matchedRules: [] }
  - { severity: warning, matchedRules: [kill] }
  - { severity: warning, matchedRules: [npm_publish] }
