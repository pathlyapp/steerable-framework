[project]
name = "steerable-example-py-server"
version = "0.0.0"
description = "FastAPI + ChatLoop development server for Steerable Web-Shell end-to-end local testing."
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.100.0",
  "uvicorn>=0.20.0",
  "httpx>=0.24.0",
  "steerable-agent-protocol",
  "steerable-agent-harness",
  "steerable-agent-runtime",
]

[tool.uv.sources]
steerable-agent-protocol = { workspace = true }
steerable-agent-harness = { workspace = true }
steerable-agent-runtime = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/steerable_example_py_server"]
