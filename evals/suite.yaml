# harbor: CLI name passed to `harbor run -a`. model is provider/model.
# env_any: ready if any listed variable is non-empty. Empty env_any
# means no key is required (oracle). skipped agents are never invoked.
agents:
  oracle:
    harbor: oracle
    model: null
    env_any: []
    skipped: false
  claude-code:
    harbor: claude-code
    model: anthropic/claude-sonnet-4-5
    env_any:
      - ANTHROPIC_API_KEY
    skipped: false
  codex:
    harbor: codex
    model: openai/gpt-5.5
    env_any:
      - OPENAI_API_KEY
      - CODEX_API_KEY
    skipped: false
  pi:
    harbor: pi
    model: anthropic/claude-sonnet-4-5
    env_any:
      - ANTHROPIC_API_KEY
    skipped: false
  dsh:
    harbor: null
    model: null
    env_any: []
    skipped: true
    reason: >-
      DeepSeek Harness has no Harbor BaseInstalledAgent. Headless
      `pnpm dsh --profile headless` is not the L2 capability gate.
  steerable:
    harbor: evals.harbor_steerable:SteerableHarborAgent
    # Local product loop: OpenRouter `z-ai/glm-5.3-flash` (cheap). Codex
    # stays `openai/gpt-5.5`. Override with `--model openai/gpt-5.5` for a
    # same-tier harness comparison.
    model: openai/z-ai/glm-5.3-flash
    env_any:
      - STEERABLE_API_KEY
      - OPENAI_API_KEY
      - ANTHROPIC_API_KEY
    skipped: false
