name: Evals weekly

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: evals-weekly
  cancel-in-progress: false

jobs:
  eval:
    name: TB 2.1 cheap-12 × ${{ matrix.agent }}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        agent: [steerable, claude-code, codex, pi]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - uses: ./.github/actions/setup-harbor
      - run: docker info
      - name: Harbor cheap-12
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CODEX_API_KEY: ${{ secrets.CODEX_API_KEY }}
          STEERABLE_API_KEY: ${{ secrets.STEERABLE_API_KEY }}
          # steerable's cheap-12 model is openai/z-ai/glm-5.3-flash — an
          # OpenRouter id. Without OPENAI_BASE_URL the agent calls the stock
          # OpenAI endpoint and every trial scores a structural 0 (first
          # weekly run, 2026-08-31: 12/12 × 0.0, ~50s trials, no tokens).
          # Pair an OpenRouter-capable OPENAI_API_KEY with
          # OPENAI_BASE_URL=https://openrouter.ai/api/v1 in repo secrets.
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
        run: |
          set +e
          uv run python -m evals.run --agent "${{ matrix.agent }}" --split cheap-12 --skip-missing-env --agent-setup-timeout-multiplier 3 --environment-build-timeout-multiplier 3 --agent-timeout-multiplier 3
          code=$?
          if [ "$code" -eq 3 ]; then
            echo skipped > "eval-status-${{ matrix.agent }}.txt"
            echo "${{ matrix.agent }}: skipped" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "$code" -eq 0 ]; then
            echo ran > "eval-status-${{ matrix.agent }}.txt"
            echo "${{ matrix.agent }}: ran" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo failed > "eval-status-${{ matrix.agent }}.txt"
          echo "${{ matrix.agent }}: failed ($code)" >> "$GITHUB_STEP_SUMMARY"
          exit "$code"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-${{ matrix.agent }}
          path: |
            eval-status-${{ matrix.agent }}.txt
            evals/jobs/${{ matrix.agent }}/**/result.json
            evals/jobs/${{ matrix.agent }}/**/config.json
          if-no-files-found: ignore

  gather:
    name: At least one live agent ran
    needs: [eval]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: eval-*
          merge-multiple: true
          path: statuses
      - name: Fail if every live agent was skipped
        run: |
          shopt -s nullglob
          files=(statuses/eval-status-*.txt)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "no eval-status artifacts; live agents did not start"
            exit 1
          fi
          cat statuses/eval-status-*.txt
          if grep -qx ran statuses/eval-status-*.txt; then
            echo "at least one live agent ran"
            exit 0
          fi
          if grep -qx failed statuses/eval-status-*.txt; then
            echo "a live agent ran and failed; the matrix job already failed"
            exit 0
          fi
          echo "every live agent was skipped (set ANTHROPIC_API_KEY and/or OPENAI_API_KEY / CODEX_API_KEY)"
          exit 1

  attribution:
    name: Harness × model attribution report
    needs: [eval]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - uses: actions/download-artifact@v4
        with:
          pattern: eval-*
          path: artifacts
      # W1.3.4: reproducible artifact, not a gate — scoring costs money and
      # the report must exist even when some matrix legs were skipped.
      - name: Build attribution report
        run: |
          set -e
          args=()
          # Job-level config.json carries the agents array; trial-level does not.
          while IFS= read -r cfg; do
            if grep -q '"agents"' "$cfg"; then
              args+=(--job "default=$(dirname "$cfg")")
            fi
          done < <(find artifacts -path "*jobs/*" -name config.json | sort)
          if [ "${#args[@]}" -eq 0 ]; then
            echo "no scored job dirs in artifacts; skipping report"
            exit 0
          fi
          uv run python -m evals.attribution "${args[@]}" --out attribution.md
          cat attribution.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: attribution
          path: attribution.md
          if-no-files-found: ignore
