[package]
name = "steerable-egress-proxy"
version = "0.6.26"
edition = "2021"
description = "Allow-listing CONNECT egress proxy (no TLS interception)."
license = "MIT"
publish = false

[lib]
name = "steerable_egress_proxy"
path = "src/lib.rs"

[[bin]]
name = "steerable-egress-proxy"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt", "macros", "net", "io-util", "time", "sync"] }
serde_json = "1"
native-tls = "0.2"
tokio-native-tls = "0.3"

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros", "net", "io-util", "time", "rt-multi-thread", "sync"] }
