name: Release Prepare

on:
  push:
    branches:
      - 'release/**'

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_BOT_PAT }}

      - name: Extract semver from branch
        id: version
        shell: bash
        run: |
          set -euo pipefail
          BRANCH="${GITHUB_REF#refs/heads/}"
          VERSION="${BRANCH#release/}"
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?(\+[A-Za-z0-9.-]+)?$'; then
            echo "::error::Branch '$BRANCH' does not match release/X.Y.Z"
            exit 1
          fi
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@v4
        with:
          version: 10.23.0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - uses: astral-sh/setup-uv@v5
        with:
          version: '0.5.31'

      - name: Run lockstep bump script
        shell: bash
        run: ./scripts/release/bump_to.sh "${{ steps.version.outputs.value }}"

      - name: Commit and push bump
        shell: bash
        env:
          GIT_AUTHOR_NAME: deeppath-release-bot
          GIT_AUTHOR_EMAIL: release-bot@deeppath.cc
          GIT_COMMITTER_NAME: deeppath-release-bot
          GIT_COMMITTER_EMAIL: release-bot@deeppath.cc
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain)" ]; then
            echo "::notice title=skip::No changes after bump; skipping commit."
            exit 0
          fi
          git add -A
          git commit -s -m "chore(release): v${{ steps.version.outputs.value }}"
          git push origin HEAD

      - name: Open (or update) release PR
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_BOT_PAT }}
        run: |
          set -euo pipefail
          BRANCH="${GITHUB_REF#refs/heads/}"
          VERSION="${{ steps.version.outputs.value }}"
          EXISTING="$(gh pr list --base main --head "$BRANCH" --state open --json number --jq '.[0].number // empty')"
          if [ -n "$EXISTING" ]; then
            echo "::notice title=skip::PR #$EXISTING already exists."
            exit 0
          fi
          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "chore(release): v$VERSION" \
            --body "Automated release prep. Merge this PR to publish."
