name: Setup Harbor
description: Install the pinned Harbor CLI and put it on PATH.

inputs:
  version:
    description: Harbor version (keep in sync with evals/suite.yaml run.harbor_version)
    required: false
    default: "0.22.0"

runs:
  using: composite
  steps:
    - name: Install Harbor
      shell: bash
      run: |
        uv tool install "harbor==${{ inputs.version }}"
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"
    - name: Prefetch musl uv for qemu trials
      shell: bash
      run: |
        dest="${GITHUB_WORKSPACE}/evals/.cache/uv-x86_64-unknown-linux-musl"
        mkdir -p "$(dirname "$dest")"
        if [ -s "$dest" ]; then
          exit 0
        fi
        curl -fsSL -o /tmp/uv-musl.tgz \
          https://github.com/astral-sh/uv/releases/download/0.9.5/uv-x86_64-unknown-linux-musl.tar.gz
        extract=$(mktemp -d)
        tar -xzf /tmp/uv-musl.tgz -C "$extract"
        bin=$(find "$extract" -name uv -type f | head -1)
        cp "$bin" "$dest"
        chmod 0755 "$dest"
    - name: Prefetch Linux CPython 3.12 for qemu trials
      shell: bash
      run: |
        dest="${GITHUB_WORKSPACE}/evals/.cache/cpython-3.12-linux-x86_64-gnu.tgz"
        mkdir -p "$(dirname "$dest")"
        if [ -s "$dest" ]; then
          exit 0
        fi
        uv python install 3.12
        py=$(uv python find 3.12)
        prefix=$(cd "$(dirname "$py")/.." && pwd)
        tar -czf "$dest" -C "$prefix" .
