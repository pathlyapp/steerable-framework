# Pinned public capability evals. This file is the source of truth for
# which Terminal-Bench 2.1 tasks and Harbor agents the regression wrapper
# may run. Homemade prompts are not a CI gate.
#
# cheap-12 avoids QEMU, GPU, video, and long compiles. It must stay a
# subset of catalog. The catalog lists the 89 task ids published at
# git_rev; do not invent extra ids.

dataset:
  name: terminal-bench/terminal-bench-2-1
  git: https://github.com/harbor-framework/terminal-bench-2-1
  git_rev: 7131e4375048a0e408a8fb404b5f499d726b695b

run:
  n_attempts: 1
  n_concurrent: 1
  jobs_dir: evals/jobs
  # Pinned Harbor CLI. Workflows install this exact version; bump here and
  # in `.github/actions/setup-harbor/action.yml` together.
  harbor_version: "0.22.0"

