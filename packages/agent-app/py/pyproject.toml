[project]
name = "steerable-agent-app"
version = "0.2.4"
description = "Steerable application: FastAPI factories, routing, and SSE endpoint setups."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.100.0",
  "uvicorn>=0.22.0",
  "sse-starlette>=1.6.0",
  "pydantic>=2.10.0",
  "sqlmodel>=0.0.22",
  "steerable-agent-protocol>=0.1.0,<1.0.0",
  "steerable-agent-kit>=0.2.4,<1.0.0",
  "steerable-agent-runtime[all]>=0.1.0,<1.0.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
steerable-agent-protocol = { workspace = true }
steerable-agent-kit = { workspace = true }
steerable-agent-runtime = { workspace = true }
