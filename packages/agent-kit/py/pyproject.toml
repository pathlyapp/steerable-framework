[project]
name = "steerable-agent-kit"
version = "0.2.4"
description = "Steerable application kit: execution engine, context system, skill engine, and minimal models."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2.10.0",
  "sqlmodel>=0.0.22",
  "steerable-agent-protocol>=0.1.0,<1.0.0",
  "steerable-agent-harness>=0.1.0,<1.0.0",
  "steerable-agent-runtime[all]>=0.1.0,<1.0.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
steerable-agent-protocol = { workspace = true }
steerable-agent-harness = { workspace = true }
steerable-agent-runtime = { workspace = true }
